version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: job-tracker-db
    environment:
      POSTGRES_DB: job_tracker
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - job_tracker_data:/var/lib/postgresql/data

volumes:
  job_tracker_data:
